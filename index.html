<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKWOOD - ขอใบกำกับภาษี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0a0a0a;
            color: #f3f4f6;
        }
        
        /* Custom scrollbar for a premium feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        /* Form input styling - made slightly lighter for better visibility */
        .premium-input {
            background-color: #222; /* Lighter than before */
            border: 1px solid #444; /* Lighter border */
            color: #fff;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            border-color: #d4af37; /* Gold accent for premium feel */
            box-shadow: 0 0 0 1px #d4af37;
            outline: none;
            background-color: #2a2a2a; /* Slightly lighter on focus */
        }
        
        /* Premium Button */
        .premium-btn {
            background: linear-gradient(135deg, #2a2a2a 0%, #111 100%);
            border: 1px solid #444;
            color: #d4af37; /* Gold text */
            transition: all 0.3s ease;
        }
        .premium-btn:hover {
            background: linear-gradient(135deg, #333 0%, #1a1a1a 100%);
            border-color: #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        /* Success Message Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] bg-fixed">

    <div class="max-w-2xl w-full">
        
        <!-- Header Section -->
        <div class="text-center mb-10 flex flex-col items-center">
            <img src="https://lh3.googleusercontent.com/d/1rv0hyEQra1LOWybBI90aV1CWD4bqU1JS" 
                 alt="BLACKWOOD Logo" 
                 onerror="this.onerror=null; this.src='https://placehold.co/400x150/1a1a1a/d4af37?text=BLACKWOOD+BKK';"
                 class="h-20 md:h-28 mb-6 object-contain">
            
            <div class="h-px w-32 bg-[#d4af37] mx-auto mb-6"></div>
            
            <h2 class="text-[#d4af37] text-3xl md:text-4xl font-semibold tracking-wider uppercase mb-2">Tax Invoice Request Form</h2>
            <h3 class="text-gray-200 text-2xl md:text-3xl font-medium">แบบฟอร์มขอใบกำกับภาษี</h3>
            <p class="text-gray-400 text-lg md:text-xl mt-3 font-light">ห้างหุ้นส่วนจำกัดแบล็ควู้ด บีเคเค</p>
        </div>

        <!-- Form Container - made slightly lighter -->
        <div class="bg-[#1a1a1a] p-6 sm:p-10 rounded-2xl border border-gray-700 shadow-2xl relative overflow-hidden">
            
            <!-- Decorative corner elements -->
            <div class="absolute top-0 left-0 w-16 h-16 border-t border-l border-[#d4af37] opacity-30 m-4 rounded-tl-lg"></div>
            <div class="absolute top-0 right-0 w-16 h-16 border-t border-r border-[#d4af37] opacity-30 m-4 rounded-tr-lg"></div>
            <div class="absolute bottom-0 left-0 w-16 h-16 border-b border-l border-[#d4af37] opacity-30 m-4 rounded-bl-lg"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b border-r border-[#d4af37] opacity-30 m-4 rounded-br-lg"></div>

            <form id="taxInvoiceForm" class="space-y-6 relative z-10">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Company/Name -->
                    <div class="md:col-span-2">
                        <label for="entityName" class="block text-sm font-medium text-gray-400 mb-2">
                            ชื่อบริษัท / ห้างหุ้นส่วน / ชื่อบุคคล <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="entityName" name="entityName" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="ระบุชื่อเต็ม (ไม่ต้องย่อ)">
                    </div>

                    <!-- Branch -->
                    <div>
                        <label for="branch" class="block text-sm font-medium text-gray-400 mb-2">
                            สาขา <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="branch" name="branch" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="เช่น สำนักงานใหญ่ หรือ สาขาที่ 00012">
                    </div>

                    <!-- Tax ID -->
                    <div>
                        <label for="taxId" class="block text-sm font-medium text-gray-400 mb-2">
                            เลขประจำตัวผู้เสียภาษี <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="taxId" name="taxId" required pattern="\d{13}" title="กรุณากรอกตัวเลข 13 หลัก"
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="ตัวเลข 13 หลัก" maxlength="13">
                    </div>

                    <!-- Address -->
                    <div class="md:col-span-2">
                        <label for="address" class="block text-sm font-medium text-gray-400 mb-2">
                            ที่อยู่ในการออกใบกำกับภาษี <span class="text-red-500">*</span>
                        </label>
                        <textarea id="address" name="address" required rows="3"
                            class="w-full px-4 py-3 rounded-lg premium-input resize-none"
                            placeholder="บ้านเลขที่ หมู่ ซอย ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์"></textarea>
                    </div>

                    <!-- Receipt Number (NEW) -->
                    <div>
                        <label for="receiptNumber" class="block text-sm font-medium text-gray-400 mb-2">
                            เลขที่ใบเสร็จ <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="receiptNumber" name="receiptNumber" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="ระบุเลขที่ใบเสร็จจากร้าน">
                    </div>

                    <!-- Receipt Image Upload (NEW) -->
                    <div>
                        <label for="receiptImage" class="block text-sm font-medium text-gray-400 mb-2">
                            อัปโหลดรูปใบเสร็จ <span class="text-red-500">*</span>
                        </label>
                        <input type="file" id="receiptImage" name="receiptImage" required accept="image/*"
                            class="w-full px-3 py-2.5 rounded-lg premium-input cursor-pointer text-gray-400
                            file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold 
                            file:bg-[#d4af37] file:text-black hover:file:bg-[#e5c158] file:cursor-pointer transition-all">
                    </div>

                    <!-- Contact Name -->
                    <div>
                        <label for="contactName" class="block text-sm font-medium text-gray-400 mb-2">
                            ชื่อผู้ติดต่อ <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="contactName" name="contactName" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="ชื่อ - นามสกุล">
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-400 mb-2">
                            เบอร์โทรศัพท์ <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="08X-XXX-XXXX">
                    </div>

                    <!-- Email -->
                    <div class="md:col-span-2">
                        <label for="email" class="block text-sm font-medium text-gray-400 mb-2">
                            อีเมล (สำหรับจัดส่งใบกำกับภาษีอิเล็กทรอนิกส์) <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-lg premium-input"
                            placeholder="example@company.com">
                    </div>
                </div>

                <div class="pt-6">
                    <button type="submit" 
                        class="w-full premium-btn py-4 rounded-lg font-semibold tracking-wide text-lg flex justify-center items-center gap-2">
                        <span>ส่งคำขอใบกำกับภาษี</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Success Message (Hidden by default) -->
            <div id="successMessage" class="hidden absolute inset-0 bg-[#111] z-20 flex flex-col items-center justify-center p-8 text-center">
                <div class="w-20 h-20 bg-green-900/30 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2" style="font-family: 'Times New Roman', serif;">THANK YOU</h3>
                <p class="text-[#d4af37] mb-4">ส่งข้อมูลสำเร็จ</p>
                <p class="text-gray-400 text-sm">
                    ทางร้านได้รับข้อมูลขอใบกำกับภาษีของคุณเรียบร้อยแล้ว<br>
                    เอกสารจะถูกจัดส่งไปยังอีเมลที่คุณระบุไว้ภายใน 1-3 วันทำการ
                </p>
                <button onclick="resetForm()" class="mt-8 px-6 py-2 border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 rounded transition-colors text-sm">
                    กรอกข้อมูลใหม่
                </button>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-12 text-gray-500 text-sm">
            &copy; 2026 BLACKWOOD. All rights reserved.
        </div>
    </div>

    <script>
        // ฟังก์ชันช่วยแปลงไฟล์รูปภาพเป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // เอาเฉพาะส่วนข้อมูล ไม่เอา Header
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('taxInvoiceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show a loading state on the button
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังอัปโหลดและส่งข้อมูล...';
            submitBtn.disabled = true;

            try {
                // จัดการไฟล์รูปภาพ
                const fileInput = document.getElementById('receiptImage');
                const file = fileInput.files[0];
                const base64Data = await getBase64(file);

                const formData = {
                    entityName: document.getElementById('entityName').value,
                    branch: document.getElementById('branch').value,
                    taxId: document.getElementById('taxId').value,
                    address: document.getElementById('address').value,
                    receiptNumber: document.getElementById('receiptNumber').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data, // ส่งข้อมูลรูปภาพไปด้วย
                    contactName: document.getElementById('contactName').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    timestamp: new Date().toISOString()
                };
                
                console.log('Prepared data for backend:', formData);

                // ==========================================
                // BACKEND INTEGRATION POINT
                // ==========================================
                
                // นำ Web App URL ที่ได้จากขั้นตอน Deploy Google Apps Script มาใส่ในเครื่องหมายคำพูดด้านล่าง
                const scriptURL = 'https://script.google.com/macros/s/AKfycbw3uM9Bbeq6pFOmhBsdJ0NHoYqCD2Ta1uH1Y6W3VUsT62Ka-LV_RSOx8bC5xH4SjlaOrQ/exec';

                // ส่งข้อมูลไปยัง Google Apps Script
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    // ใช้ text/plain เพื่อป้องกันปัญหา CORS preflight
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    }
                });
                
                const resultText = await response.text();
                
                if (response.ok && resultText === "Success") {
                    showSuccess();
                } else {
                    throw new Error(resultText);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดจากระบบ: ' + error.message + '\n\nกรุณาติดต่อแอดมิน');
            } finally {
                // คืนค่าปุ่มให้กลับมาเป็นเหมือนเดิม ไม่ว่าจะส่งสำเร็จหรือล้มเหลว
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        function showSuccess() {
            const successDiv = document.getElementById('successMessage');
            successDiv.classList.remove('hidden');
            successDiv.classList.add('fade-in');
        }

        function resetForm() {
            document.getElementById('taxInvoiceForm').reset();
            const successDiv = document.getElementById('successMessage');
            successDiv.classList.add('hidden');
            successDiv.classList.remove('fade-in');
        }

        // Add auto-formatting for phone number
        document.getElementById('phone').addEventListener('input', function (e) {
            var x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body>
</html>
